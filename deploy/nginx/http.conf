log_format veylance '$remote_addr [$time_local] "$request_method $uri" $status';
access_log /var/log/nginx/access.log veylance;
server {
 listen 80;
 server_name _;
 server_tokens off;
 location /.well-known/acme-challenge/ { root /var/www/certbot; }
 location / { proxy_pass http://app:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
 location /worker/ { return 404; }
 location /internal/ { return 404; }
 client_max_body_size 128k;
}
