log_format veylance '$remote_addr [$time_local] "$request_method $uri" $status';
access_log /var/log/nginx/access.log veylance;
server {
 listen 80;
 server_name research.example.com;
 location /.well-known/acme-challenge/ { root /var/www/certbot; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name research.example.com;
 server_tokens off;
 ssl_certificate /etc/letsencrypt/live/research.example.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/research.example.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 location /worker/ { return 404; }
 location /internal/ { return 404; }
 location /assets/ { root /srv/veylance; expires 1d; }
 location / { proxy_pass http://app:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
 client_max_body_size 128k;
}
